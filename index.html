<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso</title>

<link rel="icon" type="img/png" href="img/p.png">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Cinzel&family=Cinzel+Decorative:wght@700&family=IM+Fell+English+SC&display=swap" rel="stylesheet">

<style>
*, *::before, *::after {
    margin: 0; padding: 0; box-sizing: border-box;
}

body::before {
    content: "";
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: url('https://www.transparenttextures.com/patterns/stardust.png');
    opacity: 0.12;
    pointer-events: none;
    z-index: 1000;
    transition: opacity 3s ease;
}

body {
    height: 100vh;
    background: url("img/goth.png") no-repeat center center fixed;
    background-size: cover; 
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'IM Fell English SC', serif;
    overflow: hidden;
    background-color: black;
    transition: background 1s cubic-bezier(0.25, 1, 0.5, 1), cursor 0.3s ease;
}

body.cursor-gogh { cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' style='font-size:24px'><text y='24'>🖌️</text></svg>"), auto; }
body.cursor-goth { cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' style='font-size:24px'><text y='24'>⚰️</text></svg>"), auto; }
body.cursor-hello { cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' style='font-size:24px'><text y='24'>🎀</text></svg>"), auto; }
body.cursor-blood { cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' style='font-size:24px'><text y='24'>🔪</text></svg>"), auto; }

.particle {
    position: absolute;
    pointer-events: none;
    transition: opacity 1s ease, transform 1s ease;
}

.star-style {
    width: 2px; height: 2px;
    border-radius: 50%;
    animation: moveUp linear infinite, twinkle 2s ease-in-out infinite alternate;
}

.ember-style {
    width: var(--size);
    height: var(--size);
    background: radial-gradient(circle, rgba(230,70,20,0.9) 0%, rgba(50,10,5,0.4) 80%);
    border-radius: 30% 70% 70% 30% / 30% 40% 60% 70%;
    box-shadow: 0 0 8px rgba(255,80,20,0.6), 0 0 15px rgba(255,40,0,0.3);
    filter: blur(0.5px);
    animation: moveUp linear infinite, emberSway 3s ease-in-out infinite alternate;
}

@keyframes moveUp {
    from { transform: translateY(105vh) translateX(0); }
    to { transform: translateY(-10vh) translateX(var(--drift)); }
}

@keyframes twinkle {
    0% { opacity: 0.2; transform: scale(0.8); }
    100% { opacity: 0.8; transform: scale(1.2); }
}

@keyframes emberSway {
    0% { margin-left: 0px; rotate: 0deg; }
    100% { margin-left: 25px; rotate: 45deg; opacity: 0.4; }
}

.login-box {
    width: 320px;
    padding: 40px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 25px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    text-align: center;
    color: #ffb3c6;
    z-index: 10;
    position: relative;
    transition: transform 0.1s ease-out, box-shadow 1s ease-in-out, border-color 1s ease-in-out, color 1s ease-in-out, background 1s ease-in-out, border-radius 1s ease-in-out, border-width 0.3s ease, width 0.5s ease;
}

input {
    width: 85%;
    padding: 12px;
    margin-top: 20px;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid #7a1e2d;
    border-radius: 8px;
    color: #ffb3c6;
    text-align: center;
    outline: none;
    transition: all 0.5s ease;
}

button {
    margin-top: 25px;
    padding: 10px 25px;
    background: transparent;
    border: 1px solid #a11228;
    color: #a11228;
    cursor: inherit;
    font-family: 'Cinzel', serif;
    border-radius: 20px;
    transition: all 0.5s ease;
}

button:hover { background: #a11228; color: black; box-shadow: 0 0 15px #a11228; }

#mensagem { margin-top: 15px; font-weight: bold; min-height: 20px; transition: color 0.4s; }

.state-gogh { border-color: #f1c40f !important; box-shadow: 0 0 40px rgba(241, 196, 15, 0.4) !important; color: #f1c40f !important; }
.state-goth { border-color: #ffffff !important; box-shadow: 0 0 40px rgba(255, 255, 255, 0.4) !important; color: #fff !important; }
.state-hello { border-color: #ffc9da !important; box-shadow: 0 0 40px rgba(255, 201, 218, 0.4) !important; color: #ffc9da !important; }
.state-blood { border-color: #ff0000 !important; box-shadow: 0 0 40px rgba(255, 0, 0, 0.5) !important; color: #ff0000 !important; }
.state-quero { border-color: #0080ff !important; box-shadow: 0 0 40px rgba(0, 128, 255, 0.4) !important; color: #0080ff !important; }

.metamorfose-impacto { animation: quickFlop 0.35s cubic-bezier(0.215, 0.610, 0.355, 1) forwards; }

@keyframes quickFlop {
    0% { transform: scale(1); filter: brightness(1); }
    30% { transform: scale(1.04); filter: brightness(1.8) blur(1px); }
    100% { transform: scale(1); filter: brightness(1); }
}

body.metamorfose-ativa { background-size: cover !important; }

.login-box.metamorfose-caixa {
    width: 380px;
    background: rgba(0, 0, 0, 0.4) !important;
    backdrop-filter: blur(20px) !important;
    -webkit-backdrop-filter: blur(20px) !important;
    border-radius: 0px !important;
    color: #dfba73 !important;
    border-width: 45px !important;
    border-style: solid !important;
    border-image-slice: 65 fill !important;
    box-shadow: 0 40px 90px rgba(0, 0, 0, 1), inset 0 0 45px rgba(122, 30, 45, 0.3), 0 0 60px rgba(223, 186, 115, 0.2) !important;
}

.metamorfose-caixa input {
    background: rgba(0, 0, 0, 0.85) !important;
    border: 1px solid #dfba73 !important;
    color: #fff !important;
    font-family: 'Cinzel', serif;
    letter-spacing: 5px;
    box-shadow: inset 0 0 15px rgba(122, 30, 45, 0.7) !important;
}

.metamorfose-caixa button {
    border: 1px solid #dfba73 !important;
    color: #dfba73 !important;
    background: rgba(20, 2, 3, 0.9) !important;
    font-weight: bold;
    letter-spacing: 3px;
    border-radius: 0px !important;
}
.metamorfose-caixa button:hover {
    background: #dfba73 !important;
    color: #050101 !important;
    box-shadow: 0 0 25px #dfba73 !important;
}

.transition-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 2000; overflow: hidden; }
.final-color-fill { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2100; opacity: 0; pointer-events: none; animation: finalFillFade 1.5s forwards; animation-delay: 2.5s; }

@keyframes finalFillFade { 0% { opacity: 0; } 100% { opacity: 1; } }

.cross-img {
    position: absolute;
    width: var(--w);
    height: auto;
    filter: drop-shadow(0 0 15px rgba(0,0,0,0.95)) drop-shadow(0 0 5px rgba(223,186,115,0.4));
    z-index: 2002;
    opacity: 0;
}

@keyframes flyCrossImage {
    0% { transform: translate(var(--startX), var(--startY)) scale(0.4) rotate(var(--rotStart)); opacity: 0; }
    15% { opacity: 1; }
    85% { opacity: 1; }
    100% { transform: translate(var(--endX), var(--endY)) scale(1.4) rotate(var(--rotEnd)); opacity: 0; }
}

.mist {
    position: absolute;
    width: 200vw; height: 200vh;
    background: radial-gradient(circle, rgba(10, 1, 1, 0.99) 0%, transparent 85%);
    z-index: 2001;
    opacity: 0;
    animation: riseMist 4s forwards ease-in-out;
}

@keyframes riseMist {
    0% { transform: translateY(80vh); opacity: 0; }
    100% { transform: translateY(-30vh); opacity: 1; }
}

.exit-portal { 
    opacity: 0 !important; 
    transform: scale(0.55) perspective(1000px) rotateX(-25deg) translateY(-60px) !important; 
    pointer-events: none; 
    transition: all 2s cubic-bezier(0.6, -0.28, 0.735, 0.045) !important; 
}

.shake { animation: shake 0.5s; border-color: #ff0000 !important; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
</style>
</head>

<body>

<div class="login-box" id="loginBox">
    <h2 id="tituloPortal" style="font-family: 'Pirata One', cursive; font-size: 2.5rem; margin-bottom: 0; transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);">Nosso Portal</h2>
    <p id="subtituloPortal" style="opacity: 0.7; transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);">Somente nós dois.</p>

    <input type="password" id="senha" placeholder="Senha" autocomplete="off">
    <br>
    <button onclick="entrar()" id="btnEntrar">Entrar</button>

    <audio id="musicaFundo" loop>
        <source src="music/dark.mp3" type="audio/mpeg">
    </audio>

    <p id="mensagem"></p>
</div>

<script>
const SENHA_SECRETA_GOTICA = "relicario"; 
const URL_DESTINO_GOTICO   = "https://2p666.github.io/Vitoriano/"; 
const CAMINHO_IMAGEM_CRUZ    = "img/Cruz.png"; 
const IMAGEM_FUNDO_METAMORFOSE = "img/Skull.png";
const IMAGEM_MOLDURA_GOTICA    = "img/moldura.png"; 

const inputSenha = document.getElementById("senha");
const box = document.getElementById("loginBox");
const body = document.body;
const musica = document.getElementById("musicaFundo");
let erros = 0;
let metamorfoseDisparada = false;
let faseDoisLiberada = false;

// CORREÇÃO: Força o estado original da página ao retornar via setinha do navegador
window.addEventListener("pageshow", (event) => {
    // Reseta o input e remove classes de estado que poderiam travar a interface
    inputSenha.value = "";
    box.classList.remove('exit-portal');
    box.style.display = 'block';
    
    if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
        desfazerMetamorfose();
    }
});

function recriarParticulas(tipo) {
    document.querySelectorAll('.particle').forEach(p => p.remove());
    for(let i=0; i<55; i++){ 
        let p = document.createElement("div");
        p.className = "particle";
        p.style.left = Math.random() * 100 + "%";
        p.style.top = Math.random() * 100 + "vh";
        if (tipo === 'brasas') {
            p.classList.add('ember-style');
            const size = (Math.random() * 5 + 2) + "px";
            p.style.setProperty('--size', size);
            p.style.setProperty('--drift', (Math.random() * 80 - 40) + "px");
            p.style.animationDuration = (Math.random() * 4 + 3) + "s";
        } else {
            p.classList.add('star-style');
            p.style.background = Math.random() > 0.5 ? "#a11228" : "#0080ff";
            p.style.animationDuration = (Math.random() * 10 + 8) + "s";
        }
        p.style.animationDelay = (Math.random() * 4) + "s";
        document.body.appendChild(p);
    }
}

recriarParticulas('estrelas');

inputSenha.addEventListener("input", (e) => {
    const val = e.target.value.toLowerCase().trim();
    if(val === SENHA_SECRETA_GOTICA) {
        if(!metamorfoseDisparada) {
            metamorfoseDisparada = true;
            executarMetamorfoseCompleta();
        }
        return;
    }
    if(metamorfoseDisparada && val !== SENHA_SECRETA_GOTICA) {
        desfazerMetamorfose();
        return;
    }
    box.classList.remove('state-gogh', 'state-goth', 'state-hello', 'state-blood', 'state-quero');
    body.classList.remove('cursor-gogh', 'cursor-goth', 'cursor-hello', 'cursor-blood');
    if(val.includes("gogh")) { box.classList.add('state-gogh'); body.classList.add('cursor-gogh'); } 
    else if(val.includes("goth")) { box.classList.add('state-goth'); body.classList.add('cursor-goth'); } 
    else if(val.includes("hello") || val.includes("kitty")) { box.classList.add('state-hello'); body.classList.add('cursor-hello'); } 
    else if(val.includes("escatologia")) { box.classList.add('state-blood'); body.classList.add('cursor-blood'); } 
    else if(val.includes("quero vose")) { box.classList.add('state-quero'); }
});

document.addEventListener('mousemove', (e) => {
    if(box.classList.contains('exit-portal') || box.classList.contains('metamorfose-impacto')) {
        box.style.transform = "perspective(1000px) rotateX(0deg) rotateY(0deg)";
        return;
    }
    const x = e.clientX; const y = e.clientY;
    const rect = box.getBoundingClientRect();
    const boxCenterX = rect.left + rect.width / 2;
    const boxCenterY = rect.top + rect.height / 2;
    const rotateX = (boxCenterY - y) / 25; const rotateY = (x - boxCenterX) / 25;
    box.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
});

inputSenha.addEventListener("keypress", (e) => { 
    if(e.key === "Enter") {
        if(faseDoisLiberada) dispararSaidaPortal();
        else entrar(); 
    }
});

function executarMetamorfoseCompleta() {
    musica.play().catch(e => console.log("Áudio aguardando interação."));
    const msg = document.getElementById("mensagem");
    const titulo = document.getElementById("tituloPortal");
    const subtitulo = document.getElementById("subtituloPortal");
    box.classList.add('metamorfose-impacto');
    box.style.borderImageSource = `url("${IMAGEM_MOLDURA_GOTICA}")`;
    body.style.background = `linear-gradient(135deg, rgba(10, 0, 1, 0.99) 0%, rgba(32, 1, 4, 0.95) 45%, rgba(0, 0, 0, 1) 100%), url("${IMAGEM_FUNDO_METAMORFOSE}") no-repeat center center fixed`;
    body.classList.add('metamorfose-ativa');
    box.classList.add('metamorfose-caixa');
    body.classList.remove('cursor-gogh', 'cursor-goth', 'cursor-hello', 'cursor-blood');
    body.classList.add('cursor-goth');
    recriarParticulas('brasas');
    msg.style.color = "#dfba73";
    msg.innerText = "Para sempre";
    titulo.style.fontFamily = "'Cinzel Decorative', serif";
    titulo.innerText = "Codein";
    titulo.style.textShadow = "0 0 20px rgba(223, 186, 115, 0.6)";
    subtitulo.innerText = "1 ANO";
    subtitulo.style.color = "#dfba73";
    subtitulo.style.opacity = "0.9";
    faseDoisLiberada = true; 
    setTimeout(() => { box.classList.remove('metamorfose-impacto'); }, 400);
}

function desfazerMetamorfose() {
    musica.pause();
    musica.currentTime = 0;
    metamorfoseDisparada = false;
    faseDoisLiberada = false;
    box.classList.remove('metamorfose-impacto');
    box.style.borderImageSource = "none";
    box.style.borderWidth = "";
    body.style.background = ""; 
    body.classList.remove('metamorfose-ativa');
    box.classList.remove('metamorfose-caixa');
    body.classList.remove('cursor-goth');
    recriarParticulas('estrelas');
    const titulo = document.getElementById("tituloPortal");
    const subtitulo = document.getElementById("subtituloPortal");
    const msg = document.getElementById("mensagem");
    titulo.style.fontFamily = "'Pirata One', cursive";
    titulo.innerText = "Nosso Portal";
    titulo.style.textShadow = "none";
    subtitulo.innerText = "Somente nós dois.";
    subtitulo.style.color = "";
    subtitulo.style.opacity = "0.7";
    msg.innerText = "";
}

function dispararSaidaPortal() {
    box.classList.add('exit-portal');
    triggerSpecialTransition(() => { window.location.href = URL_DESTINO_GOTICO; });
}

function triggerSpecialTransition(callback) {
    const container = document.createElement('div');
    container.className = 'transition-overlay';
    document.body.appendChild(container);
    const colorFill = document.createElement('div');
    colorFill.className = 'final-color-fill';
    colorFill.style.backgroundColor = "#030001"; 
    document.body.appendChild(colorFill);
    const mist = document.createElement('div');
    mist.className = 'mist';
    container.appendChild(mist);
    for(let i=0; i<15; i++) {
        setTimeout(() => {
            if(!box.classList.contains('exit-portal')) return;
            const img = document.createElement('img');
            img.src = CAMINHO_IMAGEM_CRUZ;
            img.className = 'cross-img';
            const width = Math.floor(Math.random() * 40 + 50) + "px";
            const startX = Math.random() * 90 + "vw";
            const startY = "110vh";
            const endX = (Math.random() * 120 - 10) + "vw";
            const endY = "-30vh";
            const rotStart = Math.random() * 40 - 20;
            const rotEnd = rotStart + (Math.random() * 60 - 30);
            img.style.setProperty('--w', width);
            img.style.setProperty('--startX', startX);
            img.style.setProperty('--startY', startY);
            img.style.setProperty('--endX', endX);
            img.style.setProperty('--endY', endY);
            img.style.setProperty('--rotStart', rotStart + 'deg');
            img.style.setProperty('--rotEnd', rotEnd + 'deg');
            img.style.animation = `flyCrossImage 4s forwards ease-in-out`;
            container.appendChild(img);
        }, i * 180);
    }
    setTimeout(callback, 4000); 
}

function entrar() {
    if (faseDoisLiberada) { dispararSaidaPortal(); return; }
    if (metamorfoseDisparada) return; 
    let senha = inputSenha.value.toLowerCase().trim();
    const msg = document.getElementById("mensagem");
    box.classList.remove('shake');
    function acerto(url, texto, particleColor, usarTransicao) {
        msg.style.color = particleColor;
        if(texto) msg.innerText = texto;
        if(url) {
            document.body.style.background = "black";
            box.classList.add('exit-portal');
            if(usarTransicao) { triggerSpecialTransition(() => { window.location.href = url; }); } 
            else { setTimeout(() => { window.location.href = url; }, 1000); }
        } else {
            box.style.borderColor = particleColor;
            box.style.boxShadow = `0 0 30px ${particleColor}`;
            setTimeout(() => { box.style.borderColor = ""; box.style.boxShadow = ""; }, 3000);
        }
    }
    if (senha === "goth") acerto("https://2p666.github.io/goth/", "O portal das sombras se abre...", "#ffffff", true);
    else if (senha === "gogh") acerto("https://2p666.github.io/gogh/index.html", "Pintando nossa história...", "#f1c40f");
    else if (senha === "hellokitty" || senha === "hello") acerto("https://2p666.github.io/Hello/", "Hello Kitty!!!", "#ffc9da");
    else if (senha === "primeiro") acerto("Burton.html", "O primeiro de vários", "#a11228", true);
    else if (senha === "amo você") acerto("https://2p666.github.io/Sixmonts/", "Eu te amo mais", "#ff4d4d");
    else if (senha === "quero vose") acerto("https://2p666.github.io/Contador./", "Contando os segundos...", "#0080ff");
    else if (senha === "nenem") acerto(null, "Eu te amo MUUUIITOO.", "#0080ff");
    else if (senha === "papai") acerto(null, "QUE LINDAAA VOSE ACERTOU", "#0080ff");
    else if (senha === "segredo") acerto(null, "Gênia", "#0080ff");
    else if (senha === "codeina") acerto(null, "Dona do meu ser.", "#0080ff");
    else if (senha === "escatologia filmes") acerto("https://escatologiafilmes.com", "O horror se aproxima...", "#ff0000");
    else if (senha === "larga a mão") acerto(null, "KKKKKKK larga a mão que você escreveu larga a mão", "#0080ff");
    else if (senha === "infinito") acerto(null, "Nosso tempo é eterno.", "#0080ff");
    else if (senha === "kaneki" || senha === "paulo") acerto(null, "Eu i ele né", "#0080ff");
    else if (senha === "tubarão te amo") acerto(null, "TCHUBARAAAWWWWW", "#0080ff");
    else if (senha === "") msg.innerText = "Digite a chave.";
    else {
        erros++;
        void box.offsetWidth; 
        box.classList.add('shake');
        msg.style.color = "#ff0000";
        msg.innerText = erros >= 3 ? "Dica: Só dia 01/06" : "Senha Incorreta.";
    }
}
</script>
</body>
</html>
