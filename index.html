<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multivariável</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=IM+Fell+English:ital@0;1&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    /* ==============================================================
       MULTIVARIÁVEL — CONTADOR DO REINO
       Tudo que você precisa trocar está concentrado em CONFIG, no JS.
       Não há SVG nem imagens externas: use somente seus arquivos em img/.
       ============================================================== */

    :root {
      --accent: #bfc2c7;
      --accent-rgb: 191, 194, 199;
      --accent-soft: #f1f1f1;
      --ink: #121416;
      --panel: rgba(18, 19, 21, .76);
      --moon-glow: rgba(225, 225, 225, .25);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #05090e;
      color: #f5fbff;
    }

    body {
      font-family: 'IM Fell English', Georgia, serif;
      user-select: none;
    }

    #scene,
    .layer {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    #scene {
      isolation: isolate;
      background-color: var(--ink);
      background-image: var(--background-image);
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      transition: background-image 1.2s ease, filter 1.2s ease, background-position .25s ease;
    }

    #scene::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: var(--scene-overlay,
        linear-gradient(135deg, rgba(3, 10, 23, .68), rgba(var(--accent-rgb), .07) 46%, rgba(0, 0, 0, .78)),
        radial-gradient(circle at 72% 21%, var(--moon-glow), transparent 27%));
      mix-blend-mode: multiply;
      transition: background 1.2s ease;
    }

    #scene.awake { filter: saturate(1.11) brightness(1.06); }

    #moon-image,
    #cemiterio-image,
    #moldura-image {
      position: absolute;
      display: none;
      pointer-events: none;
      object-fit: contain;
      -webkit-user-drag: none;
      user-select: none;
    }

    #moon-image {
      z-index: 3;
      width: min(31vw, 330px);
      right: 10vw;
      top: 7vh;
      pointer-events: auto;
      cursor: pointer;
      filter: drop-shadow(0 0 37px var(--moon-glow));
      animation: moonBreathe 6s ease-in-out infinite;
      transition: filter 1.1s ease, scale 1.1s ease;
    }

    #scene.awake #moon-image {
      scale: 1.055;
      filter: drop-shadow(0 0 67px var(--moon-glow));
    }

    #cemiterio-image {
      z-index: 6;
      width: min(53vw, 620px);
      height: auto;
      left: -1.5vw;
      bottom: -2vh;
      opacity: .9;
      filter: drop-shadow(0 9px 14px rgba(0, 0, 0, .75)) brightness(.8) contrast(1.06);
      animation: graveyardBreath 11s ease-in-out infinite;
    }

    #mist {
      z-index: 8;
      pointer-events: none;
      opacity: .73;
      background:
        radial-gradient(ellipse at 18% 82%, rgba(214, 228, 230, .2), transparent 42%),
        radial-gradient(ellipse at 70% 72%, rgba(var(--accent-rgb), .13), transparent 49%),
        linear-gradient(0deg, rgba(211, 226, 229, .15), transparent 42%);
      filter: blur(13px);
      transform: scale(1.14);
      animation: mistDrift 16s ease-in-out infinite alternate;
      transition: opacity 1.2s ease, filter 1.2s ease;
    }

    #scene.awake #mist { opacity: 1; filter: blur(17px) brightness(1.14); }
    #bat-layer { z-index: 10; pointer-events: none; }
    #shooting-star-layer { z-index: 11; pointer-events: none; }
    #theme-stage { z-index: 12; pointer-events: none; }
    #spark-layer { z-index: 17; pointer-events: none; }

    #moldura-image {
      z-index: 19;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    #vignette {
      z-index: 20;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 50%, transparent 31%, rgba(0, 0, 0, .17) 66%, rgba(0, 0, 0, .76) 100%);
    }

    .bat {
      position: absolute;
      width: var(--bat-size);
      left: -20vw;
      top: var(--bat-top);
      opacity: 0;
      transform-origin: center;
      filter: drop-shadow(0 0 5px rgba(0, 0, 0, .78));
      animation: batFlight var(--bat-duration) linear var(--bat-delay) forwards;
    }

    .bat.reverse {
      left: auto;
      right: -20vw;
      transform: scaleX(-1);
      animation-name: batFlightReverse;
    }

    .shooting-star {
      position: absolute;
      left: -30vw;
      top: var(--star-top);
      width: var(--star-size);
      opacity: 0;
      filter: drop-shadow(0 0 4px rgba(247, 220, 132, .2));
      animation: shootingStar 1.25s cubic-bezier(.1, .52, .2, 1) forwards;
    }

    .star-tip {
      position: absolute;
      right: 2%;
      bottom: 7%;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 233, 160, .78);
      box-shadow: 0 0 10px 2px rgba(255, 214, 100, .38);
      animation: tipPulse .45s ease-in-out infinite alternate;
    }

    .spark {
      position: absolute;
      width: var(--spark-size);
      height: var(--spark-size);
      left: var(--spark-x);
      top: var(--spark-y);
      border-radius: 50%;
      background: rgba(222, 240, 248, .95);
      box-shadow: 0 0 12px 3px rgba(var(--accent-rgb), .7);
      animation: sparkRise var(--spark-duration) ease-out forwards;
    }

    .stage-asset {
      position: absolute;
      width: var(--asset-width);
      left: var(--asset-left);
      top: var(--asset-top);
      opacity: 0;
      object-fit: cover;
      border: var(--asset-border, 0);
      border-radius: var(--asset-radius, 0);
      box-shadow: var(--asset-shadow, none);
      filter: var(--asset-filter, none);
      transform: rotate(var(--asset-rotate)) scale(.87);
      animation: assetArrive .85s cubic-bezier(.2,.8,.2,1) forwards, assetFloat var(--asset-float) ease-in-out .9s infinite alternate;
    }

    /* ===================== CONTADOR ===================== */
    main {
      position: relative;
      z-index: 16;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      pointer-events: none;
    }

    .portal-panel {
      width: min(720px, 100%);
      padding: 40px 34px 30px;
      text-align: center;
      pointer-events: auto;
      border: 1px solid rgba(var(--accent-rgb), .58);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(5, 15, 30, .8), var(--panel));
      box-shadow: inset 0 0 42px rgba(var(--accent-rgb), .13), 0 0 60px rgba(var(--accent-rgb), .24), 0 28px 65px rgba(0, 0, 0, .45);
      backdrop-filter: blur(12px);
      transition: border-color .8s ease, background .8s ease, box-shadow .8s ease, transform .7s ease;
    }

    .portal-panel.previewing { transform: scale(1.018); }
    .overline { margin: 0 0 13px; color: var(--accent-soft); font: 10px 'Share Tech Mono', monospace; letter-spacing: 4px; text-transform: uppercase; }
    h1 { margin: 0; font: 600 clamp(28px, 5.7vw, 55px) Cinzel, serif; letter-spacing: 1.5px; text-shadow: 0 0 22px rgba(var(--accent-rgb), .45); }
    .subtitle { margin: 14px auto 26px; max-width: 520px; color: rgba(240, 249, 255, .85); font-size: 17px; line-height: 1.5; }

    .counter-box { position: relative; padding: 22px 12px 14px; border-top: 1px solid rgba(var(--accent-rgb), .23); border-bottom: 1px solid rgba(var(--accent-rgb), .23); }
    .counter-status { min-height: 18px; margin: 0 0 15px; color: var(--accent-soft); font: 10px 'Share Tech Mono', monospace; letter-spacing: 2px; text-transform: uppercase; }
    .slots { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
    .slot { min-width: 0; padding: 10px 4px 8px; border: 1px solid rgba(var(--accent-rgb), .26); border-radius: 10px; background: rgba(1, 7, 18, .45); cursor: pointer; transition: transform .22s, border-color .22s, background .22s, box-shadow .22s; }
    .slot:hover, .slot.editing { transform: translateY(-4px); border-color: var(--accent); background: rgba(var(--accent-rgb), .13); box-shadow: 0 0 20px rgba(var(--accent-rgb), .25); }
    .slot-value { display: block; min-height: 34px; font: 500 clamp(20px, 3.2vw, 32px) 'Share Tech Mono', monospace; color: white; text-shadow: 0 0 15px rgba(var(--accent-rgb), .85); }
    .slot-name { display: block; margin-top: 4px; color: var(--accent-soft); font: 8px 'Share Tech Mono', monospace; letter-spacing: 1.15px; text-transform: uppercase; }
    .slot-input { display: none; width: 100%; min-height: 34px; border: 0; outline: 0; border-radius: 6px; text-align: center; color: #fff; background: rgba(255,255,255,.13); font: 500 clamp(20px, 3.2vw, 32px) 'Share Tech Mono', monospace; }
    .slot.editing .slot-value { display: none; }
    .slot.editing .slot-input { display: block; }

    .selected-date { min-height: 22px; margin: 17px 0 0; color: rgba(237, 247, 255, .87); font-size: 15px; font-style: italic; }
    .selected-theme { min-height: 18px; margin: 5px 0 0; color: var(--accent-soft); font: 9px 'Share Tech Mono', monospace; letter-spacing: 1.8px; text-transform: uppercase; }
    .actions { display: flex; justify-content: center; gap: 10px; min-height: 45px; margin-top: 22px; }
    button.action { border: 1px solid rgba(var(--accent-rgb), .75); border-radius: 999px; padding: 11px 18px; color: #fff; cursor: pointer; background: linear-gradient(110deg, rgba(var(--accent-rgb), .86), rgba(255,255,255,.14)); box-shadow: 0 0 25px rgba(var(--accent-rgb), .28); font: 10px 'Share Tech Mono', monospace; letter-spacing: 1.6px; text-transform: uppercase; transition: transform .22s, filter .22s; }
    button.action:hover { transform: translateY(-3px); filter: brightness(1.15); }
    button.action.secondary { background: rgba(3, 13, 26, .58); box-shadow: none; }
    button.hidden { display: none; }

    #gate {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      background: radial-gradient(circle, rgba(var(--accent-rgb), .9), rgba(0, 0, 0, .98) 70%);
      transition: opacity .9s ease, visibility .9s ease;
    }
    #gate.open { opacity: 1; visibility: visible; }
    .gate-ring { width: min(48vw, 410px); aspect-ratio: 1; border: 1px solid rgba(255,255,255,.8); border-radius: 50%; box-shadow: 0 0 70px 20px rgba(var(--accent-rgb), .52), inset 0 0 55px rgba(var(--accent-rgb), .55); animation: gateOpen 1.9s ease-in-out infinite alternate; }

    @keyframes batFlight { 0% { opacity:0; translate:0 0; rotate:-8deg; } 8% { opacity:var(--bat-opacity); } 37% { translate:43vw var(--bat-arc); rotate:8deg; } 68% { translate:82vw calc(var(--bat-arc) * -.36); rotate:-4deg; } 91% { opacity:var(--bat-opacity); } 100% { opacity:0; translate:125vw var(--bat-end); rotate:6deg; } }
    @keyframes batFlightReverse { 0% { opacity:0; translate:0 0; rotate:-8deg; } 8% { opacity:var(--bat-opacity); } 37% { translate:-43vw var(--bat-arc); rotate:8deg; } 68% { translate:-82vw calc(var(--bat-arc) * -.36); rotate:-4deg; } 91% { opacity:var(--bat-opacity); } 100% { opacity:0; translate:-125vw var(--bat-end); rotate:6deg; } }
    @keyframes moonBreathe { 50% { transform: scale(1.018); } }
    @keyframes graveyardBreath { 50% { transform: translateY(-3px); filter: drop-shadow(0 12px 17px rgba(0,0,0,.78)) brightness(.88) contrast(1.08); } }
    @keyframes mistDrift { to { transform:scale(1.18) translateX(2.5%) translateY(-1.5%); opacity:.96; } }
    @keyframes shootingStar { 0%{opacity:0;translate:0 0;rotate:18deg}8%{opacity:.9}75%{opacity:.8}100%{opacity:0;translate:145vw 48vh;rotate:18deg} }
    @keyframes tipPulse { to { opacity:.5; scale:.72; } }
    @keyframes sparkRise { 0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}20%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--spark-drift)),-150px) scale(.1)} }
    @keyframes assetArrive { to { opacity:var(--asset-opacity); transform:rotate(var(--asset-rotate)) scale(1); } }
    @keyframes assetFloat { to { translate:var(--asset-drift) -13px; } }
    @keyframes gateOpen { to { scale:1.18; filter:brightness(1.4); } }

    @media (max-width: 700px) {
      main { padding: 14px; }
      .portal-panel { padding: 30px 15px 22px; border-radius: 22px; }
      .subtitle { font-size: 15px; margin-bottom: 20px; }
      .slots { grid-template-columns: repeat(3, 1fr); gap: 7px; }
      #moon-image { width: 44vw; right: 2vw; top: 8vh; }
      #cemiterio-image { width: 92vw; left: -12vw; bottom: -1vh; }
      .stage-asset { width: min(var(--asset-width), 34vw); }
    }
  </style>
</head>
<body>
  <div id="scene" data-theme="reino">
    <img id="moon-image" alt="">
    <img id="cemiterio-image" alt="">
    <div class="layer" id="mist"></div>
    <div class="layer" id="bat-layer"></div>
    <div class="layer" id="shooting-star-layer"></div>
    <div class="layer" id="theme-stage"></div>
    <div class="layer" id="spark-layer"></div>
    <img id="moldura-image" alt="">
    <div class="layer" id="vignette"></div>
  </div>

  <main>
    <section class="portal-panel" id="portalPanel">
      <div class="counter-box">
        <p class="counter-status" id="counterStatus"></p>
        <div class="slots" id="slots"></div>
        <p class="selected-date" id="selectedDate"></p>
        <p class="selected-theme" id="selectedTheme"></p>

        <button class="action hidden" id="openButton" type="button">Abrir esta porta</button>
        <button class="action secondary hidden" id="nowButton" type="button">Voltar ao presente</button>
      </div>
    </section>
  </main>

  <div id="gate" aria-hidden="true"><div class="gate-ring"></div></div>

        }
      }
    };

    const UNIDADES = [
      { chave: 'anos', nome: 'Anos', min: 0, max: 99 },
      { chave: 'meses', nome: 'Meses', min: 0, max: 11 },
      { chave: 'dias', nome: 'Dias', min: 0, max: 31 },
      { chave: 'horas', nome: 'Horas', min: 0, max: 23 },
      { chave: 'minutos', nome: 'Min', min: 0, max: 59 },
      { chave: 'segundos', nome: 'Seg', min: 0, max: 59 }
    ];

    const inicio = new Date(CONFIG.inicioRelacionamento);
    const scene = document.getElementById('scene');
    const slots = document.getElementById('slots');
    const counterStatus = document.getElementById('counterStatus');
    const selectedDate = document.getElementById('selectedDate');
    const selectedTheme = document.getElementById('selectedTheme');
    const portalPanel = document.getElementById('portalPanel');
    const openButton = document.getElementById('openButton');
    const nowButton = document.getElementById('nowButton');
    const moonImage = document.getElementById('moon-image');
    const cemeteryImage = document.getElementById('cemiterio-image');
    const frameImage = document.getElementById('moldura-image');
    const batLayer = document.getElementById('bat-layer');
    const starLayer = document.getElementById('shooting-star-layer');
    const sparkLayer = document.getElementById('spark-layer');
    const themeStage = document.getElementById('theme-stage');
    const gate = document.getElementById('gate');

    let editando = false;
    let intervaloContador = null;
    let temaAtual = null;

    function aleatorio(minimo, maximo) { return Math.random() * (maximo - minimo) + minimo; }
    function inteiro(minimo, maximo) { return Math.floor(aleatorio(minimo, maximo + 1)); }
    function preencher(numero) { return String(numero).padStart(2, '0'); }

    function usarImagem(elemento, caminho) {
      if (!caminho) return;
      elemento.src = caminho;
      elemento.style.display = 'block';
    }

    function diferencaCalendario(inicioData, fimData) {
      const alvo = new Date(fimData);
      const cursor = new Date(inicioData);
      const resultado = {};

      resultado.anos = alvo.getFullYear() - cursor.getFullYear();
      cursor.setFullYear(cursor.getFullYear() + resultado.anos);
      if (cursor > alvo) { resultado.anos--; cursor.setFullYear(cursor.getFullYear() - 1); }

      resultado.meses = (alvo.getFullYear() - cursor.getFullYear()) * 12 + alvo.getMonth() - cursor.getMonth();
      cursor.setMonth(cursor.getMonth() + resultado.meses);
      if (cursor > alvo) { resultado.meses--; cursor.setMonth(cursor.getMonth() - 1); }

      let restante = alvo - cursor;
      resultado.dias = Math.floor(restante / 86400000);
      cursor.setDate(cursor.getDate() + resultado.dias);
      restante = alvo - cursor;
      resultado.horas = Math.floor(restante / 3600000);
      restante %= 3600000;
      resultado.minutos = Math.floor(restante / 60000);
      restante %= 60000;
      resultado.segundos = Math.floor(restante / 1000);
      return resultado;
    }

    function dataDaDuracao(valores) {
      const data = new Date(inicio);
      data.setFullYear(data.getFullYear() + valores.anos);
      data.setMonth(data.getMonth() + valores.meses);
      data.setDate(data.getDate() + valores.dias);
      data.setHours(data.getHours() + valores.horas);
      data.setMinutes(data.getMinutes() + valores.minutos);
      data.setSeconds(data.getSeconds() + valores.segundos);
      return data;
    }

    function dataBonita(data) {
      return new Intl.DateTimeFormat('pt-BR', {
        dateStyle: 'full', timeStyle: 'short', timeZone: 'America/Sao_Paulo'
      }).format(data);
    }

    function montarSlots(valores) {
      slots.innerHTML = '';
      UNIDADES.forEach(unidade => {
        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.dataset.chave = unidade.chave;
        slot.innerHTML = `
          <span class="slot-value">${preencher(valores[unidade.chave] || 0)}</span>
          <input class="slot-input" type="number" min="${unidade.min}" max="${unidade.max}" value="${valores[unidade.chave] || 0}" aria-label="${unidade.nome}">
          <span class="slot-name">${unidade.nome}</span>`;
        slot.addEventListener('click', () => editarSlot(slot));
        const input = slot.querySelector('input');
        input.addEventListener('click', evento => evento.stopPropagation());
        input.addEventListener('input', atualizarManual);
        input.addEventListener('blur', () => slot.classList.remove('editing'));
        slots.appendChild(slot);
      });
    }

    function valoresDosSlots() {
      const valores = {};
      UNIDADES.forEach(unidade => {
        const input = document.querySelector(`[data-chave="${unidade.chave}"] .slot-input`);
        const numero = Number(input.value);
        valores[unidade.chave] = Math.max(unidade.min, Math.min(unidade.max, Number.isFinite(numero) ? numero : 0));
      });
      return valores;
    }

    function atualizarSlots(valores) {
      UNIDADES.forEach(unidade => {
        const slot = document.querySelector(`[data-chave="${unidade.chave}"]`);
        if (!slot) return;
        slot.querySelector('.slot-value').textContent = preencher(valores[unidade.chave] || 0);
        slot.querySelector('.slot-input').value = valores[unidade.chave] || 0;
      });
    }

    function editarSlot(slot) {
      if (!editando) {
        editando = true;
        clearInterval(intervaloContador);
        counterStatus.textContent = '';
        openButton.classList.remove('hidden');
        nowButton.classList.remove('hidden');
        atualizarManual();
      }
      slot.classList.add('editing');
      const input = slot.querySelector('input');
      input.focus();
      input.select();
    }

    function destinoPara(data, valores) {
      if (valores.meses === 6 && valores.dias === 6 && valores.horas === 6) return CONFIG.segredo666;
      return CONFIG.destinos.find(destino => data >= new Date(destino.inicio) && (!destino.fim || data <= new Date(destino.fim))) || null;
    }

    function aplicarTema(destino) {
      const chave = destino?.id || 'reino';
      if (temaAtual === chave) return;
      temaAtual = chave;
      const tema = destino ? destino.ambiente : CONFIG.reino.ambiente;
      const esconder = new Set(tema.hide || []);

      scene.dataset.theme = chave;
      scene.style.setProperty('--accent', tema.accent);
      scene.style.setProperty('--accent-rgb', tema.rgb);
      scene.style.setProperty('--accent-soft', tema.soft);
      scene.style.setProperty('--moon-glow', `rgba(${tema.rgb}, .43)`);
      scene.style.setProperty('--background-image', `url("${tema.background || CONFIG.fundoGeral || CONFIG.reino.background}")`);
      scene.style.setProperty('--scene-overlay', tema.overlay || 'none');
      portalPanel.style.background = tema.panel;
      portalPanel.style.color = tema.soft;
      portalPanel.classList.toggle('previewing', Boolean(destino));
      moonImage.style.display = esconder.has('moon') ? 'none' : (CONFIG.reino.lua ? 'block' : 'none');
      cemeteryImage.style.display = esconder.has('cemiterio') ? 'none' : (CONFIG.reino.cemiterio ? 'block' : 'none');
      document.getElementById('mist').style.display = esconder.has('mist') ? 'none' : 'block';
      batLayer.style.display = esconder.has('bats') ? 'none' : 'block';
      starLayer.style.display = esconder.has('star') ? 'none' : 'block';
      mostrarCenario(tema.assets || [], tema.imagens || []);
    }

    function mostrarCenario(assets, imagens) {
      themeStage.innerHTML = '';
      const posicoesAutomaticas = [
        { left: '4vw', top: '9vh', width: '18vw', rotate: '-6deg' },
        { left: '78vw', top: '10vh', width: '17vw', rotate: '6deg' },
        { left: '5vw', top: '68vh', width: '16vw', rotate: '4deg' },
        { left: '80vw', top: '66vh', width: '15vw', rotate: '-4deg' }
      ];
      const automaticos = imagens.filter(Boolean).slice(0, 4).map((src, indice) => ({
        src, ...posicoesAutomaticas[indice], opacity: .94,
        border: '1px solid rgba(255,255,255,.42)',
        shadow: '0 10px 28px rgba(0,0,0,.32)'
      }));
      [...automaticos, ...assets].filter(asset => asset.src).forEach((asset, indice) => {
        const imagem = document.createElement('img');
        imagem.className = 'stage-asset';
        imagem.src = asset.src;
        imagem.alt = '';
        imagem.style.setProperty('--asset-left', asset.left || '0');
        imagem.style.setProperty('--asset-top', asset.top || '0');
        imagem.style.setProperty('--asset-width', asset.width || '180px');
        imagem.style.setProperty('--asset-rotate', asset.rotate || '0deg');
        imagem.style.setProperty('--asset-opacity', asset.opacity ?? .85);
        imagem.style.setProperty('--asset-drift', asset.drift || (indice % 2 ? '-9px' : '9px'));
        imagem.style.setProperty('--asset-float', asset.float || `${4.5 + indice * .4}s`);
        imagem.style.setProperty('--asset-filter', asset.filter || 'none');
        imagem.style.setProperty('--asset-shadow', asset.shadow || 'none');
        imagem.style.setProperty('--asset-border', asset.border || '0');
        imagem.style.setProperty('--asset-radius', asset.radius || '0');
        imagem.addEventListener('error', () => imagem.remove());
        themeStage.appendChild(imagem);
      });
    }

    function atualizarManual() {
      const valores = valoresDosSlots();
      atualizarSlots(valores);
      const data = dataDaDuracao(valores);
      const destino = destinoPara(data, valores);
      selectedDate.textContent = `Esta porta leva para: ${dataBonita(data)}.`;

      if (destino) {
        selectedTheme.textContent = `O reino agora veste a memória: ${destino.nome}.`;
        aplicarTema(destino);
      } else {
        selectedTheme.textContent = data > new Date() ? 'Esse instante ainda não chegou.' : 'Ainda não existe uma porta criada para esta parte da história.';
        aplicarTema(null);
      }
    }

    function atualizarContadorVivo() {
      if (editando) return;
      atualizarSlots(diferencaCalendario(inicio, new Date()));
    }

    function voltarAoPresente() {
      editando = false;
      counterStatus.textContent = '';
      selectedDate.textContent = '';
      selectedTheme.textContent = '';
      openButton.classList.add('hidden');
      nowButton.classList.add('hidden');
      document.querySelectorAll('.slot').forEach(slot => slot.classList.remove('editing'));
      aplicarTema(null);
      atualizarContadorVivo();
      intervaloContador = setInterval(atualizarContadorVivo, 1000);
    }

    function abrirDestino() {
      const valores = valoresDosSlots();
      const data = dataDaDuracao(valores);
      const destino = destinoPara(data, valores);
      if (!destino || data > new Date()) return;
      scene.style.setProperty('--accent-rgb', destino.rgb);
      gate.classList.add('open');
      setTimeout(() => { window.location.href = destino.url; }, 1300);
    }

    function criarBando() {
      const imagens = CONFIG.reino.morcegos.filter(Boolean);
      if (!imagens.length) return;
      const quantidade = inteiro(4, 8);
      const reverso = Math.random() > .5;
      for (let i = 0; i < quantidade; i++) {
        const morcego = document.createElement('img');
        morcego.className = `bat${reverso ? ' reverse' : ''}`;
        morcego.src = imagens[i % imagens.length];
        morcego.alt = '';
        morcego.style.setProperty('--bat-size', `${aleatorio(34, 105)}px`);
        morcego.style.setProperty('--bat-top', `${aleatorio(7, 63)}vh`);
        morcego.style.setProperty('--bat-duration', `${aleatorio(2.2, 4.2)}s`);
        morcego.style.setProperty('--bat-delay', `${i * aleatorio(.16, .35)}s`);
        morcego.style.setProperty('--bat-arc', `${aleatorio(-90, 90)}px`);
        morcego.style.setProperty('--bat-end', `${aleatorio(-44, 44)}px`);
        morcego.style.setProperty('--bat-opacity', aleatorio(.5, .96));
        morcego.addEventListener('animationend', () => morcego.remove());
        batLayer.appendChild(morcego);
      }
    }

    function programarBandos() {
      setTimeout(() => { criarBando(); programarBandos(); }, inteiro(10000, 15000));
    }

    function criarEstrelaCadente() {
      if (!CONFIG.reino.estrelaCadente) return;
      const estrela = document.createElement('div');
      estrela.className = 'shooting-star';
      estrela.style.setProperty('--star-top', `${aleatorio(5, 29)}vh`);
      estrela.style.setProperty('--star-size', `${aleatorio(74, 155)}px`);
      const imagem = document.createElement('img');
      imagem.src = CONFIG.reino.estrelaCadente;
      imagem.alt = '';
      imagem.style.cssText = 'width:100%;display:block';
      const ponta = document.createElement('i');
      ponta.className = 'star-tip';
      estrela.append(imagem, ponta);
      estrela.addEventListener('animationend', () => estrela.remove());
      starLayer.appendChild(estrela);
    }

    function programarEstrelas() { setTimeout(() => { criarEstrelaCadente(); programarEstrelas(); }, 30000); }

    function criarBrilhos(x, y, quantidade) {
      for (let i = 0; i < quantidade; i++) {
        const brilho = document.createElement('i');
        brilho.className = 'spark';
        brilho.style.setProperty('--spark-x', `${x}px`);
        brilho.style.setProperty('--spark-y', `${y}px`);
        brilho.style.setProperty('--spark-size', `${aleatorio(1, 4)}px`);
        brilho.style.setProperty('--spark-duration', `${aleatorio(1.2, 2.6)}s`);
        brilho.style.setProperty('--spark-drift', `${aleatorio(-125, 125)}px`);
        brilho.addEventListener('animationend', () => brilho.remove());
        sparkLayer.appendChild(brilho);
      }
    }

    function alternarLua(evento) {
      evento.stopPropagation();
      const acordado = scene.classList.contains('awake');
      scene.classList.toggle('awake');
      const lua = moonImage.getBoundingClientRect();
      criarBrilhos(lua.left + lua.width / 2, lua.top + lua.height / 2, acordado ? 16 : 46);
      if (!acordado) criarBando();
    }

    function parallax(evento) {
      const x = (evento.clientX / window.innerWidth - .5) * 8;
      const y = (evento.clientY / window.innerHeight - .5) * 8;
      scene.style.backgroundPosition = `calc(50% + ${x}px) calc(50% + ${y}px)`;
      moonImage.style.translate = `${x * -.6}px ${y * -.45}px`;
    }

    function iniciarCenario() {
      scene.style.setProperty('--background-image', `url("${CONFIG.fundoGeral || CONFIG.reino.background}")`);
      usarImagem(moonImage, CONFIG.reino.lua);
      usarImagem(cemeteryImage, CONFIG.reino.cemiterio);
      usarImagem(frameImage, CONFIG.reino.moldura);
      aplicarTema(null);
      setTimeout(criarBando, 1800);
      setTimeout(criarEstrelaCadente, 7000);
      programarBandos();
      programarEstrelas();
    }

    montarSlots(diferencaCalendario(inicio, new Date()));
    iniciarCenario();
    atualizarContadorVivo();
    intervaloContador = setInterval(atualizarContadorVivo, 1000);

    openButton.addEventListener('click', abrirDestino);
    nowButton.addEventListener('click', voltarAoPresente);
    moonImage.addEventListener('pointerdown', alternarLua);
    window.addEventListener('pointermove', parallax);
    document.addEventListener('keydown', evento => {
      if (evento.key === 'Enter' && editando) {
        evento.preventDefault();
        abrirDestino();
      }
    });
  </script>
</body>
</html>
