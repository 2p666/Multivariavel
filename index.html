<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso</title>

<link rel="icon" type="img/png" href="img/p.png">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Cinzel&display=swap" rel="stylesheet">

<style>
/* FILTRO DE RUÍDO / GRÃO */
body::before {
    content: "";
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: url('https://www.transparenttextures.com/patterns/stardust.png');
    opacity: 0.12;
    pointer-events: none;
    z-index: 1000;
}

body {
    margin: 0;
    height: 100vh;
    background: url("img/Login.jpg") no-repeat center center fixed;
    background-size: cover; 
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'IM Fell English SC', serif;
    overflow: hidden;
    background-color: black;
    transition: background 3s ease-in-out, cursor 0.3s ease;
}

/* CURSORES PERSONALIZADOS */
body.cursor-gogh { cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' style='font-size:24px'><text y='24'>🖌️</text></svg>"), auto; }
body.cursor-goth { cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' style='font-size:24px'><text y='24'>⚰️</text></svg>"), auto; }
body.cursor-hello { cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' style='font-size:24px'><text y='24'>🎀</text></svg>"), auto; }
body.cursor-blood { cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' style='font-size:24px'><text y='24'>🔪</text></svg>"), auto; }

/* ESTRELAS DE FUNDO */
.star {
    position: absolute;
    width: 2px; height: 2px;
    border-radius: 50%;
    pointer-events: none;
    animation: moveStar linear infinite, twinkle 2s ease-in-out infinite alternate;
}

@keyframes moveStar {
    from { transform: translateY(105vh); }
    to { transform: translateY(-5vh); }
}

@keyframes twinkle {
    0% { opacity: 0.2; transform: scale(0.8); }
    100% { opacity: 0.8; transform: scale(1.1); }
}

/* CAIXA DE LOGIN */
.login-box {
    width: 320px;
    padding: 40px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 25px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    text-align: center;
    color: #ffb3c6;
    z-index: 10;
    position: relative;
    transition: transform 0.1s ease-out, box-shadow 0.6s ease-in-out, border-color 0.6s ease-in-out, color 0.6s ease-in-out, opacity 1s ease-in-out;
}

input {
    width: 85%;
    padding: 12px;
    margin-top: 20px;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid #7a1e2d;
    border-radius: 8px;
    color: #ffb3c6;
    text-align: center;
    outline: none;
    transition: 0.3s;
}

button {
    margin-top: 25px;
    padding: 10px 25px;
    background: transparent;
    border: 1px solid #a11228;
    color: #a11228;
    cursor: inherit;
    font-family: 'Cinzel', serif;
    border-radius: 20px;
    transition: 0.3s;
}

button:hover { background: #a11228; color: black; box-shadow: 0 0 15px #a11228; }

#mensagem { margin-top: 15px; font-weight: bold; min-height: 20px; transition: color 0.4s; }

/* ESTADOS DINÂMICOS NA DIGITAÇÃO */
.state-gogh { border-color: #f1c40f !important; box-shadow: 0 0 40px rgba(241, 196, 15, 0.4) !important; color: #f1c40f !important; }
.state-goth { border-color: #ffffff !important; box-shadow: 0 0 40px rgba(255, 255, 255, 0.4) !important; color: #fff !important; }
.state-hello { border-color: #ffc9da !important; box-shadow: 0 0 40px rgba(255, 201, 218, 0.4) !important; color: #ffc9da !important; }
.state-blood { border-color: #ff0000 !important; box-shadow: 0 0 40px rgba(255, 0, 0, 0.5) !important; color: #ff0000 !important; }

/* TRANSIÇÕES LENTAS */
.transition-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 2000; overflow: hidden; }

/* Camada Final de Cobertura Total */
.final-color-fill {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 2100; /* Acima de tudo */
    opacity: 0;
    pointer-events: none;
    animation: finalFillFade 1.5s forwards;
    animation-delay: 2.5s; /* Começa no final da transição de 4s */
}

@keyframes finalFillFade {
    0% { opacity: 0; }
    100% { opacity: 1; }
}

/* Morcegos */
.bat-svg {
    position: absolute;
    width: 140px; 
    fill: black;
    filter: drop-shadow(0 0 12px rgba(0,0,0,0.8));
    z-index: 2002;
    opacity: 0;
}

@keyframes flyBat {
    0% { transform: translate(var(--startX), var(--startY)) scale(0.6) rotate(var(--rotStart)); opacity: 0; }
    20% { opacity: 1; }
    80% { opacity: 1; }
    100% { transform: translate(var(--endX), var(--endY)) scale(1.8) rotate(var(--rotEnd)); opacity: 0; }
}

/* Névoa Burtoniana */
.mist {
    position: absolute;
    width: 200vw; height: 200vh;
    background: radial-gradient(circle, rgba(15,15,15,0.95) 0%, transparent 80%);
    z-index: 2001;
    opacity: 0;
    animation: riseMist 4s forwards ease-in-out;
}

@keyframes riseMist {
    0% { transform: translateY(80vh); opacity: 0; }
    100% { transform: translateY(-30vh); opacity: 1; }
}

/* Estrelas Gogh */
.gogh-star {
    position: absolute;
    font-size: 50px;
    color: #f1c40f;
    filter: drop-shadow(0 0 15px #f1c40f);
    animation: spinStar 4s forwards ease-out;
}

@keyframes spinStar {
    0% { transform: scale(0) rotate(0deg); opacity: 1; }
    100% { transform: scale(12) rotate(720deg); opacity: 0; }
}

/* Explosões Suaves */
.pop-effect {
    position: absolute;
    border-radius: 50%;
    animation: explodeGeneric 4s forwards cubic-bezier(0.2, 0.5, 0.3, 1);
}

@keyframes explodeGeneric {
    0% { transform: scale(0); opacity: 1; }
    100% { transform: scale(60); opacity: 0; }
}

.exit-portal { opacity: 0 !important; transform: scale(0.7) !important; pointer-events: none; }
.shake { animation: shake 0.5s; border-color: #ff0000 !important; }

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
}
</style>
</head>

<body>

<div class="login-box" id="loginBox">
    <h2 style="font-family: 'Pirata One', cursive; font-size: 2.5rem; margin-bottom: 0;">Nosso Portal</h2>
    <p style="opacity: 0.7;">Somente nós dois.</p>

    <input type="password" id="senha" placeholder="Senha" autocomplete="off">
    <br>
    <button onclick="entrar()" id="btnEntrar">Entrar</button>

    <p id="mensagem"></p>
</div>

<script>
/* RESET AO VOLTAR */
window.addEventListener("pageshow", (event) => {
    if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
        document.body.style.background = ""; 
        document.body.className = "";
        box.classList.remove('exit-portal');
        inputSenha.value = "";
        document.getElementById("mensagem").innerText = "";
        const overlays = document.querySelectorAll('.transition-overlay');
        overlays.forEach(o => o.remove());
        const fills = document.querySelectorAll('.final-color-fill');
        fills.forEach(f => f.remove());
    }
});

/* ESTRELAS */
for(let i=0; i<60; i++){ 
    let star = document.createElement("div");
    star.className = "star";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "vh";
    const color = Math.random() > 0.5 ? "#a11228" : "#0080ff";
    star.style.background = color;
    star.style.animationDuration = (Math.random() * 10 + 8) + "s";
    star.style.animationDelay = (Math.random() * 5) + "s";
    document.body.appendChild(star);
}

const inputSenha = document.getElementById("senha");
const box = document.getElementById("loginBox");
const body = document.body;
let erros = 0;

/* FEEDBACK DINÂMICO + CURSORES */
inputSenha.addEventListener("input", (e) => {
    const val = e.target.value.toLowerCase().trim();
    box.classList.remove('state-gogh', 'state-goth', 'state-hello', 'state-blood');
    body.classList.remove('cursor-gogh', 'cursor-goth', 'cursor-hello', 'cursor-blood');
    
    if(val.includes("gogh")) {
        box.classList.add('state-gogh');
        body.classList.add('cursor-gogh');
    } else if(val.includes("goth")) {
        box.classList.add('state-goth');
        body.classList.add('cursor-goth');
    } else if(val.includes("hello") || val.includes("kitty")) {
        box.classList.add('state-hello');
        body.classList.add('cursor-hello');
    } else if(val.includes("escatologia")) {
        box.classList.add('state-blood');
        body.classList.add('cursor-blood');
    }
});

/* EFEITO TILT (SEGUIR O MOUSE) */
document.addEventListener('mousemove', (e) => {
    if(box.classList.contains('exit-portal')) return;
    
    const x = e.clientX;
    const y = e.clientY;
    const rect = box.getBoundingClientRect();
    const boxCenterX = rect.left + rect.width / 2;
    const boxCenterY = rect.top + rect.height / 2;
    
    // Cálculo da rotação
    const rotateX = (boxCenterY - y) / 25;
    const rotateY = (x - boxCenterX) / 25;
    
    box.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
});

inputSenha.addEventListener("keypress", (e) => { if(e.key === "Enter") entrar(); });

function triggerSpecialTransition(type, callback) {
    const container = document.createElement('div');
    container.className = 'transition-overlay';
    document.body.appendChild(container);

    // Cria a camada de preenchimento final de cor
    const colorFill = document.createElement('div');
    colorFill.className = 'final-color-fill';
    document.body.appendChild(colorFill);

    if (type === 'bat') {
        colorFill.style.backgroundColor = "black"; // Gótico preenche com preto profundo
        const mist = document.createElement('div');
        mist.className = 'mist';
        container.appendChild(mist);

        for(let i=0; i<18; i++) {
            setTimeout(() => {
                const bat = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                bat.setAttribute("viewBox", "0 0 100 60");
                bat.setAttribute("class", "bat-svg");
                bat.innerHTML = `<path d="M50,15 c-5-8-15-8-22-2 c-5,5-8,15-2,25 c5,8 15,10 24,2 c2,8 8,8 10,0 c9,8 19,6 24-2 c6-10 3-20-2-25 c-7-6-17-6-22,2 Z"/>`;
                
                const startX = Math.random() * 90 + "vw";
                const startY = "110vh";
                const endX = (Math.random() * 120 - 10) + "vw";
                const endY = "-20vh";
                const rotStart = Math.random() * 30 - 15;
                const rotEnd = rotStart + (Math.random() * 60 - 30);

                bat.style.setProperty('--startX', startX);
                bat.style.setProperty('--startY', startY);
                bat.style.setProperty('--endX', endX);
                bat.style.setProperty('--endY', endY);
                bat.style.setProperty('--rotStart', rotStart + 'deg');
                bat.style.setProperty('--rotEnd', rotEnd + 'deg');

                bat.style.animation = `flyBat 4s forwards ease-in-out`;
                container.appendChild(bat);
            }, i * 150);
        }
    } else if (type === 'star') {
        colorFill.style.backgroundColor = "#f1c40f"; // Amarelo Van Gogh
        for(let i=0; i<20; i++) {
            const s = document.createElement('div');
            s.className = 'gogh-star';
            s.innerHTML = '✦';
            s.style.left = Math.random() * 100 + "vw";
            s.style.top = Math.random() * 100 + "vh";
            s.style.animationDelay = (Math.random() * 1.5) + "s";
            container.appendChild(s);
        }
    } else if (type === 'pink' || type === 'blood') {
        const colorPop = type === 'pink' ? 'radial-gradient(circle, #ffc9da 20%, #ff85a2 80%, transparent 100%)' : 'radial-gradient(circle, #ff0000 20%, #660000 85%, transparent 100%)';
        colorFill.style.backgroundColor = type === 'pink' ? "#ffc9da" : "#660000"; // Rosa Kitty ou Vermelho Sangue Escuro

        for(let i=0; i<20; i++) {
            setTimeout(() => {
                const p = document.createElement('div');
                p.className = 'pop-effect';
                p.style.background = colorPop;
                p.style.width = '180px'; p.style.height = '180px';
                p.style.left = Math.random() * 100 + "vw";
                p.style.top = Math.random() * 100 + "vh";
                if(type === 'blood') p.style.borderRadius = "45% 55% 65% 35%"; 
                container.appendChild(p);
            }, i * 120);
        }
    }
    setTimeout(callback, 4000); 
}

function entrar() {
    let senha = inputSenha.value.toLowerCase().trim();
    const msg = document.getElementById("mensagem");
    box.classList.remove('shake');

    function acerto(url, texto, particleColor, transitionType) {
        msg.style.color = particleColor;
        if(texto) msg.innerText = texto;
        if(url) {
            document.body.style.background = "black";
            box.classList.add('exit-portal');
            triggerSpecialTransition(transitionType, () => {
                window.location.href = url;
            });
        } else {
            box.style.borderColor = particleColor;
            box.style.boxShadow = `0 0 30px ${particleColor}`;
            setTimeout(() => { 
                box.style.borderColor = ""; 
                box.style.boxShadow = ""; 
            }, 3000);
        }
    }

    if (senha === "goth") acerto("portal.html", "O portal das sombras se abre...", "#ffffff", "bat");
    else if (senha === "gogh2p666") acerto("https://2p666.github.io/gogh/index.html", "Pintando nossa história...", "#f1c40f", "star");
    else if (senha === "hellokitty" || senha === "hello") acerto("https://void2p.github.io/Portal/", "Hello Kitty!!!", "#ffc9da", "pink");
    else if (senha === "primeiro") acerto("Burton.html", "O primeiro de vários", "#a11228", "bat");
    else if (senha === "amo você") acerto("Amo você.html", "Eu te amo mais", "#ff4d4d", "pink");
    else if (senha === "nenem") acerto(null, "Eu te amo MUUUIITOO.", "#0080ff");
    else if (senha === "papai") acerto(null, "QUE LINDAAA VOSE ACERTOU", "#0080ff");
    else if (senha === "segredo") acerto(null, "Gênia", "#0080ff");
    else if (senha === "codeina") acerto(null, "Dona do meu ser.", "#0080ff");
    else if (senha === "escatologia filmes") acerto("https://escatologiafilmes.com", "O horror se aproxima...", "#ff0000", "blood");
    else if (senha === "larga a mão") acerto(null, "KKKKKKK larga a mão que você escreveu larga a mão", "#0080ff");
    else if (senha === "infinito") acerto(null, "Nosso tempo é eterno.", "#0080ff");
    else if (senha === "kaneki" || senha === "paulo") acerto(null, "Eu i ele né", "#0080ff");
    else if (senha === "tubarão te amo") acerto(null, "TCHUBARAAAWWWWW", "#0080ff");
    else if (senha === "") msg.innerText = "Digite a chave.";
    else {
        erros++;
        void box.offsetWidth; 
        box.classList.add('shake');
        msg.innerText = erros >= 3 ? "Dica: Só dia 01/07" : "Senha Incorreta.";
    }
}
</script>
</body>
</html>
